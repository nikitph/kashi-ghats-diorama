</head><body><canvas id="dio-canvas" width="540" height="960"></canvas><script>
(function(){
if(THREE.ColorManagement && 'legacyMode' in THREE.ColorManagement) THREE.ColorManagement.legacyMode=false;
const W=1080, H=1920, DURATION=30;
const LITE=false;

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('dio-canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,W/H,0.3,120);

const bgCanvas=document.createElement('canvas'); bgCanvas.width=bgCanvas.height=512;
const bgx=bgCanvas.getContext('2d');
const bgTex=new THREE.CanvasTexture(bgCanvas); bgTex.encoding=THREE.sRGBEncoding; scene.background=bgTex;
function drawBg(m){
  bgx.globalAlpha=1;
  let g=bgx.createRadialGradient(256,170,10,256,256,430);
  g.addColorStop(0,'#fffaf3');g.addColorStop(0.5,'#f2e8db');g.addColorStop(1,'#d8c4ab');

  if(m>0){
    bgx.globalAlpha=m;
    g=bgx.createRadialGradient(256,470,10,256,330,520);
    g.addColorStop(0,'#c0634c');g.addColorStop(0.25,'#6b3a62');g.addColorStop(0.6,'#251d44');g.addColorStop(1,'#0e0b1c');
    bgx.fillStyle=g;bgx.fillRect(0,0,512,512);
  }
  bgTex.needsUpdate=true;
}
drawBg(0);

/* ---------- seeded randomness so the town is the same every visit ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=mulberry32(1008);
const R=(a,b)=>a+(b-a)*rand();
const pick=a=>a[Math.floor(rand()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- environment map (gold, water) ---------- */
const pmrem=new THREE.PMREMGenerator(renderer);
const envTex=(()=>{
  const es=new THREE.Scene();
  const g=new THREE.SphereGeometry(10,32,16), cols=[], p=g.attributes.position;
  const top=new THREE.Color('#dfe9f2'), hor=new THREE.Color('#f7dcb8'), low=new THREE.Color('#5a4636');
  for(let i=0;i<p.count;i++){const y=p.getY(i)/10; const c=y>0?hor.clone().lerp(top,Math.pow(y,0.6)):hor.clone().lerp(low,Math.min(1,-y*3)); cols.push(c.r,c.g,c.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  const sp=new THREE.Mesh(new THREE.CircleGeometry(1.4,24),new THREE.MeshBasicMaterial({color:new THREE.Color(14,11,8)}));
  sp.position.set(5,4.5,7); sp.lookAt(0,0,0); es.add(sp);
  return pmrem.fromScene(es,0.02).texture;
})();

/* ---------- surface shading: stone courses, weathered plaster, earth strata, river effects ---------- */
const U={uTime:{value:0},uCaus:{value:1},uFoam:{value:1},uWater:{value:new THREE.Color('#3c7d74')}};
const KIND={stone:0,plaster:1,earth:2,plain:3};
function patch(m,kind){
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWP;\nvarying vec3 vWN;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
#ifdef USE_INSTANCING
  vWP=(modelMatrix*instanceMatrix*vec4(transformed,1.0)).xyz; vWN=normalize(mat3(modelMatrix)*mat3(instanceMatrix)*objectNormal);
#else
  vWP=(modelMatrix*vec4(transformed,1.0)).xyz; vWN=normalize(mat3(modelMatrix)*objectNormal);
#endif`);
    sh.fragmentShader='#define SURF_KIND '+kind+'\n'+sh.fragmentShader
      .replace('#include <common>',`#include <common>
varying vec3 vWP; varying vec3 vWN;
uniform float uTime; uniform float uCaus; uniform float uFoam; uniform vec3 uWater;
float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float caustic(vec2 uv,float time){
  vec2 p=mod(uv*6.28318,6.28318)-250.0; vec2 i=p; float c=1.0; float inten=0.005;
  for(int n=0;n<4;n++){float t=time*(1.0-(3.5/float(n+1)));i=p+vec2(cos(t-i.x)+sin(t+i.y),sin(t-i.y)+cos(t+i.x));
    c+=1.0/length(vec2(p.x/(sin(i.x+t)/inten),p.y/(cos(i.y+t)/inten)));}
  c/=4.0; c=1.17-pow(c,1.4); return clamp(pow(abs(c),8.0),0.0,1.0);
}`)
      .replace('#include <color_fragment>',`#include <color_fragment>
{
  vec3 n=abs(vWN);
  float uw=step(vWP.y,-0.005)*step(-0.45,vWP.z)*step(abs(vWP.x),11.97)*step(vWP.z,8.97);
#if SURF_KIND==0
  vec2 uv = n.y>0.5 ? vWP.xz*vec2(1.7,2.6) : (n.x>0.5 ? vWP.zy*vec2(1.7,3.4) : vWP.xy*vec2(1.7,3.4));
  float row=floor(uv.y); uv.x+=mod(row,2.0)*0.5;
  vec2 f=fract(uv); vec2 id=floor(uv);
  float e=smoothstep(0.0,0.045,f.x)*smoothstep(1.0,0.955,f.x)*smoothstep(0.0,0.07,f.y)*smoothstep(1.0,0.93,f.y);
  float v=0.88+0.14*h21(id)+0.12*(vn(vWP.xz*2.5+vWP.y*1.3)-0.5)+0.05*(vn(vWP.xz*14.0+vWP.yy*9.0)-0.5);
  diffuseColor.rgb*=mix(0.66,1.0,e)*v;
  float chip=step(0.94,h21(floor(vWP.xz*19.0)+floor(vWP.y*27.0)));
  diffuseColor.rgb*=1.0-chip*0.16;
  float riverSide=step(-0.45,vWP.z);
  float above=smoothstep(-0.03,0.0,vWP.y)*(1.0-smoothstep(0.1,0.85,vWP.y+0.3*vn(vWP.xz*1.7)));
  diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.22,0.15,0.09)*(0.8+0.4*vn(vWP.xz*5.0)),above*0.7*riverSide);
  diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.05,0.08,0.035),(1.0-smoothstep(0.0,0.45,-vWP.y))*uw*0.55);
#elif SURF_KIND==1
  float g=vn(vWP.xy*1.3+vWP.zz*1.3+vec2(3.1,7.7));
  diffuseColor.rgb*=0.9+0.12*vn(vWP.xy*4.0+vWP.zz*4.0)+0.04*(h21(floor((vWP.xy+vWP.zy)*70.0))-0.5);
  if(n.y<0.5){
    float col=vn(vec2((vWP.x+vWP.z)*8.0,vWP.y*0.22));
    float streak=smoothstep(0.5,0.85,col)*(0.55+0.45*vn(vec2((vWP.x+vWP.z)*34.0,vWP.y*2.5)));
    diffuseColor.rgb*=1.0-streak*0.38;
    diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(0.82,0.9,0.78),streak*0.6);
    float peel=smoothstep(0.75,0.775,g);
    vec2 bu=(n.x>0.5?vWP.zy:vWP.xy)*vec2(10.0,22.0); bu.x+=mod(floor(bu.y),2.0)*0.5;
    vec2 bf=fract(bu); float mortar=step(0.08,bf.x)*step(0.14,bf.y);
    vec3 brick=mix(vec3(0.45,0.42,0.36),vec3(0.36,0.09,0.04)*(0.75+0.5*h21(floor(bu))),mortar);
    diffuseColor.rgb=mix(diffuseColor.rgb,brick,peel);
    diffuseColor.rgb*=1.0-smoothstep(0.71,0.75,g)*(1.0-peel)*0.28;
  } else {
    diffuseColor.rgb*=0.8+0.2*vn(vWP.xz*3.0);
  }
#elif SURF_KIND==2
  float wv=vWP.y+0.35*vn(vWP.xz*0.7+vWP.zx*0.7)+0.1*vn(vWP.zy*5.0+vWP.xy*5.0);
  vec3 top=vec3(0.13,0.07,0.035), sand=vec3(0.3,0.19,0.1), clay=vec3(0.2,0.085,0.04), deep=vec3(0.07,0.045,0.03);
  vec3 ec=mix(deep,clay,smoothstep(-3.1,-2.8,wv));
  ec=mix(ec,sand,smoothstep(-1.6,-1.25,wv));
  ec=mix(ec,clay*1.15,smoothstep(0.2,0.4,wv)*(1.0-smoothstep(0.8,1.0,wv)));
  ec=mix(ec,top,smoothstep(2.0,2.4,wv));
  ec*=0.82+0.3*vn((vWP.xy+vWP.zy)*vec2(3.0,9.0));
  float pb=h21(floor((vWP.xy+vWP.zy)*15.0));
  ec=mix(ec,vec3(0.32,0.29,0.25)*(0.7+0.6*h21(floor((vWP.xy+vWP.zy)*15.0)+3.0)),step(0.88,pb)*0.8);
  diffuseColor.rgb=ec*diffuseColor.rgb;
#endif
  if(uw>0.5){
    float dep=clamp(-vWP.y/2.3,0.0,1.0);
    diffuseColor.rgb=mix(diffuseColor.rgb,uWater,0.2+0.6*dep);
    float ca=caustic(vWP.xz*0.32,uTime*0.35);
    diffuseColor.rgb+=ca*uCaus*(1.0-0.65*dep)*vec3(0.75,0.95,0.85)*0.55;
  }
#if SURF_KIND==0
  float wl=vWP.y-0.014*sin(uTime*1.7+vWP.x*2.3+vWP.z);
  float foam=(1.0-smoothstep(0.0,0.05,abs(wl)))*step(-0.45,vWP.z)*(0.45+0.55*vn(vWP.xz*7.0+uTime*0.5));
  diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.86,0.88,0.84),foam*0.8*uFoam);
#endif
}`);
  };
  m.customProgramCacheKey=()=>'surf'+kind;
  return m;
}
const matCache={};
function mat(color,kind=-1,extra={}){
  const key=color+'|'+kind+'|'+JSON.stringify(extra);
  if(matCache[key]) return matCache[key];
  const m=new THREE.MeshStandardMaterial(Object.assign({color,roughness:0.92,metalness:0},extra)); m.name='k'+kind+'|'+color;
  if(kind>=0) patch(m,kind);
  return matCache[key]=m;
}
const GOLD=new THREE.MeshStandardMaterial({color:'#e8b04c',metalness:1,roughness:0.24,envMap:envTex,envMapIntensity:1.5});
const EARTH=mat('#ffffff',KIND.earth), SILT=mat('#b49e7c',KIND.plain);
function tone(hex,k,toward='#5f5650'){return '#'+new THREE.Color(hex).lerp(new THREE.Color(toward),k).getHexString();}

/* ---------- geometry helpers ---------- */
const BOX=new THREE.BoxGeometry(1,1,1);
const RB={};
function rgeo(w,h,d,r){r=Math.max(0.004,Math.min(r,w/2-0.002,h/2-0.002,d/2-0.002));const k=[w,h,d,r].map(v=>v.toFixed(3)).join(',');return RB[k]||(RB[k]=new THREE.RoundedBoxGeometry(w,h,d,2,r));}
function rb(parent,m,x0,x1,y0,y1,z0,z1,r=0.03,cast=true){
  const mesh=new THREE.Mesh(rgeo(x1-x0,y1-y0,z1-z0,r),m);
  mesh.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); mesh.castShadow=cast; mesh.receiveShadow=true; parent.add(mesh); return mesh;
}
function addMesh(parent,geo,m,x,y,z,cast=true){const mesh=new THREE.Mesh(geo,m);mesh.position.set(x,y,z);mesh.castShadow=cast;mesh.receiveShadow=true;parent.add(mesh);return mesh;}

/* instanced batches */
const _o=new THREE.Object3D();
const batches={};
function inst(name,x,y,z,ry,sx,sy,sz,color,rx=0,rz=0){
  _o.position.set(x,y,z);_o.rotation.set(rx,ry,rz);_o.scale.set(sx,sy,sz);_o.updateMatrix();
  (batches[name]||(batches[name]=[])).push({m:_o.matrix.clone(),c:color?new THREE.Color(color):null});
}
function flushBatch(name,geo,m,cast=false){
  const arr=batches[name]||[]; if(!arr.length) return null;
  const im=new THREE.InstancedMesh(geo,m,arr.length); im.name='inst_'+name;
  arr.forEach((b,i)=>{im.setMatrixAt(i,b.m); if(b.c) im.setColorAt(i,b.c);});
  im.castShadow=cast; im.receiveShadow=true; scene.add(im); return im;
}
/* one LineSegments for every wire and washing line */
const wireSegs=[];
function catenary(a,b,sag,n=14){
  const p=t=>new THREE.Vector3(lerp(a.x,b.x,t),lerp(a.y,b.y,t)-sag*4*t*(1-t),lerp(a.z,b.z,t));
  for(let i=0;i<n;i++){const p0=p(i/n),p1=p((i+1)/n); wireSegs.push(p0.x,p0.y,p0.z,p1.x,p1.y,p1.z);}
  return p;
}

/* ---------- the land: sections south to north (left to right from the river) ---------- */
const NSTEP=16, STEP_Z0=-0.5, STEP_Z1=4.6, DZ=(STEP_Z1-STEP_Z0)/NSTEP;
const BED=-2.2, FLOOR=-3.0, BASE=-3.7;
const ZT=[[-2.6,-0.5],[-5.4,-2.6],[-9,-5.4]];
const SECTIONS=[
  {key:'harishchandra',x0:-12, x1:-6.5,t:[1.0,2.0,2.9],stone:'#c2a382'},
  {key:'dashashwamedh',x0:-6.5,x1:-1,  t:[1.2,2.4,3.4],stone:'#d4b48c'},
  {key:'vishwanath',   x0:-1,  x1:4.5, t:[1.2,2.3,3.3],stone:'#ddc39e'},
  {key:'manikarnika',  x0:4.5, x1:12,  t:[1.4,2.6,3.7],stone:'#ad9884'},
];
SECTIONS.forEach(s=>{s.rise=(s.t[0]-BED)/NSTEP; s.m=mat(s.stone,KIND.stone); s.top=mat(tone(s.stone,-0.1,'#fff4e4'),KIND.stone);});
const sectionAt=x=>SECTIONS.find(s=>x>=s.x0&&x<s.x1)||SECTIONS[3];
const stepTop=(s,k)=>s.t[0]-(k+0.5)*s.rise;
function groundY(x,z){
  const s=sectionAt(x);
  if(z>=STEP_Z0){const k=Math.max(0,Math.min(NSTEP-1,Math.floor((z-STEP_Z0)/DZ)));return stepTop(s,k);}
  if(z>=ZT[0][0]) return s.t[0];
  if(z>=ZT[1][0]) return s.t[1];
  return s.t[2];
}
function stepZAtY(s,y){const k=Math.round((s.t[0]-y)/s.rise-0.5);return STEP_Z0+(k+0.5)*DZ;}

rb(scene,EARTH,-12,12,BASE,FLOOR+0.05,-9,9,0.08);
rb(scene,[EARTH,EARTH,SILT,EARTH,EARTH,EARTH],-12,12,FLOOR,BED,STEP_Z1-0.3,9,0.04);

function faces(s,{back=false}={}){
  return [s.x1>=12?EARTH:s.m, s.x0<=-12?EARTH:s.m, s.top, s.m, s.m, back?EARTH:s.m];
}
const VSTAIR=[0.85,2.65];
SECTIONS.forEach(s=>{
  rb(scene,faces(s),s.x0,s.x1,FLOOR,s.t[0],ZT[0][0],ZT[0][1],0.04);
  if(s.key==='vishwanath'){
    rb(scene,faces(s),s.x0,VSTAIR[0],FLOOR,s.t[1],ZT[1][0],ZT[1][1],0.04);
    rb(scene,faces(s),VSTAIR[1],s.x1,FLOOR,s.t[1],ZT[1][0],ZT[1][1],0.04);
    const marble=mat('#efe8dc',KIND.stone);
    rb(scene,[s.m,s.m,marble,s.m,s.m,EARTH],s.x0,s.x1,FLOOR,s.t[2],ZT[2][0],ZT[2][1],0.04);
    const n=9, dz=(ZT[1][1]-ZT[1][0])/n;
    for(let k=0;k<n;k++) rb(scene,[s.m,s.m,marble,s.m,s.m,s.m],VSTAIR[0],VSTAIR[1],FLOOR,s.t[0]+(k+1)*(s.t[2]-s.t[0])/n,ZT[1][0],ZT[1][1]-k*dz,0.025);
  } else {
    rb(scene,faces(s),s.x0,s.x1,FLOOR,s.t[1],ZT[1][0],ZT[1][1],0.04);
    rb(scene,faces(s,{back:true}),s.x0,s.x1,FLOOR,s.t[2],ZT[2][0],ZT[2][1],0.04);
  }
  for(let k=0;k<NSTEP;k++){
    const y=stepTop(s,k), m=k%2?s.m:s.top;
    rb(scene,[s.x1>=12?EARTH:m,s.x0<=-12?EARTH:m,m,m,m,m],s.x0,s.x1,FLOOR,y,STEP_Z0,STEP_Z0+(k+1)*DZ,0.03,k<10);
  }
});
SECTIONS.forEach(s=>{
  const cm=mat(tone(s.stone,-0.18,'#fff8ec'),KIND.stone);
  if(s.key!=='vishwanath') rb(scene,cm,s.x0+0.01,s.x1-0.01,s.t[1]-0.02,s.t[1]+0.07,ZT[1][1]-0.12,ZT[1][1]+0.05,0.025);
  else { rb(scene,cm,s.x0+0.01,VSTAIR[0],s.t[1]-0.02,s.t[1]+0.07,ZT[1][1]-0.12,ZT[1][1]+0.05,0.025); rb(scene,cm,VSTAIR[1],s.x1-0.01,s.t[1]-0.02,s.t[1]+0.07,ZT[1][1]-0.12,ZT[1][1]+0.05,0.025); }
});
function burj(x,s,r,withPavilion){
  const h=s.t[0]-FLOOR;
  addMesh(scene,new THREE.CylinderGeometry(r,r*1.04,h,8,1,false,0,Math.PI),s.m,x,FLOOR+h/2,STEP_Z0-0.02).rotation.y=-Math.PI/2;
  addMesh(scene,new THREE.CylinderGeometry(r+0.05,r+0.05,0.08,8,1,false,0,Math.PI),mat(tone(s.stone,-0.18,'#fff8ec'),KIND.stone),x,s.t[0]+0.02,STEP_Z0-0.02).rotation.y=-Math.PI/2;
  if(withPavilion) chhatri(scene,x,s.t[0]+0.06,STEP_Z0+r*0.42,2.3,'#efe2cc');
}

/* ---------- the river ---------- */
const WATER_DAY=new THREE.Color('#3f8f86'), WATER_DUSK=new THREE.Color('#1c2740');
function waterNormals(){
  const S=256, c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d'); const img=x.createImageData(S,S);
  const W=[]; const r2=mulberry32(77);
  for(let i=0;i<14;i++){const a=Math.round(r2()*10-5)||1,b=Math.round(r2()*8-4); W.push([a,b,1/Math.sqrt(a*a+b*b),r2()*6.28]);}
  for(let j=0;j<S;j++) for(let i=0;i<S;i++){
    const u=i/S,v=j/S; let dx=0,dy=0;
    W.forEach(([a,b,amp,ph])=>{const k=Math.cos(6.2832*(a*u+b*v)+ph)*amp*6.2832;dx+=k*a;dy+=k*b;});
    const nx=-dx*0.012,ny=-dy*0.012,nz=1,l=Math.hypot(nx,ny,nz); const o=(j*S+i)*4;
    img.data[o]=(nx/l*0.5+0.5)*255;img.data[o+1]=(ny/l*0.5+0.5)*255;img.data[o+2]=(nz/l*0.5+0.5)*255;img.data[o+3]=255;
  }
  x.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(7,2.8); return t;
}
const waterNormal=waterNormals();
const waterMat=new THREE.MeshStandardMaterial({color:WATER_DAY.clone(),transparent:true,opacity:0.5,roughness:0.05,metalness:0,envMap:envTex,envMapIntensity:0.5,
  normalMap:waterNormal,normalScale:new THREE.Vector2(0.45,0.45),depthWrite:false});
const waterGeo=new THREE.PlaneGeometry(24,9.5,96,40); waterGeo.rotateX(-Math.PI/2); waterGeo.translate(0,0,4.25);
const water=new THREE.Mesh(waterGeo,waterMat); water.receiveShadow=true; water.renderOrder=2; water.userData.noAO=true; scene.add(water);
const waterBase=waterGeo.attributes.position.array.slice();
function sidePlane(w,h){
  const g=new THREE.PlaneGeometry(w,h,1,8), p=g.attributes.position, cols=[];
  const top=new THREE.Color('#5fb3a5'), bot=new THREE.Color('#123e42');
  for(let i=0;i<p.count;i++){const t=(p.getY(i)+h/2)/h; const c=bot.clone().lerp(top,Math.pow(t,1.4)); cols.push(c.r,c.g,c.b);}
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); return g;
}
const sideMat=new THREE.MeshStandardMaterial({vertexColors:true,color:'#ffffff',transparent:true,opacity:0.62,roughness:0.08,envMap:envTex,envMapIntensity:0.25,side:THREE.DoubleSide,depthWrite:false});

  const k=new THREE.Mesh(new THREE.SphereGeometry(r*0.11,14,10),GOLD); k.position.y=top+h*0.09; g.add(k);
  const kc=new THREE.Mesh(new THREE.ConeGeometry(r*0.05,h*0.1,10),GOLD); kc.position.y=top+h*0.16; g.add(kc);
  if(flag){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,h*0.42,4),mat('#3b2a1e')); pole.position.set(r*0.05,top+h*0.24,0); g.add(pole);

}
function puffTex(){

function hullGeo(len,beam,depth){
  const g=new THREE.CylinderGeometry(0.5,0.5,1,18,10,true,0,Math.PI);
  g.rotateZ(-Math.PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const u=p.getX(i)*2; let y=p.getY(i), z=p.getZ(i);
    const taper=Math.max(0,1-Math.pow(Math.abs(u),2.4));
    z*=beam*Math.sqrt(taper); y=y*depth*2*(1-0.45*u*u)+0.08*u*u;
    p.setXYZ(i,u*len/2,y,z);
  }
  g.computeVertexNormals(); return g;
}

function exportAll(){
  const info={fires:fireLights.map(l=>l.position.toArray()),
    smokes:smokes.map(e=>({p:[e.x,e.y,e.z],spread:e.spread,height:e.height})),
    aarti:aartiLamps.map(a=>[a.x,a.y,a.z]),
    diyas:Array.from({length:DIYA_N},(_,i)=>[diyaPos[i*3],diyaPos[i*3+2],diyaSpd[i]]),
    movers:movers.map(b=>({a:b.a,sp:b.sp,rx:b.rx,rz:b.rz,zc:b.zc})),
    aartiLight:aartiLight.position.toArray()};
  const drop=[];
  scene.traverse(o=>{
    if(o.isSprite||o.isPoints||o.isLight) drop.push(o);
    else if(o.isMesh&&o.material&&(o.material.isShadowMaterial||['water','waterside'].includes(o.material.name))) drop.push(o);
    else if(o.isMesh&&o.material&&o.material.isMeshBasicMaterial&&!/flame/.test(o.material.name)) drop.push(o);
  });
  drop.forEach(o=>o.parent&&o.parent.remove(o));
  // movers: tag them so Blender can animate them
  movers.forEach((b,i)=>{b.g.name='mover_'+i;});
  aartiLamps.forEach((a,i)=>{a.lamp.name='aartilamp_'+i;});
  // multi-material meshes -> one mesh per material group (the r147 exporter mangles grouped meshes)
  const multi=[]; scene.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh&&Array.isArray(o.material)) multi.push(o);});
  multi.forEach(o=>{
    const src=o.geometry.index?o.geometry.toNonIndexed():o.geometry;
    const byMat={};
    src.groups.forEach(g=>{(byMat[g.materialIndex]=byMat[g.materialIndex]||[]).push(g);});
    Object.entries(byMat).forEach(([mi,groups])=>{
      const geo=new THREE.BufferGeometry();
      for(const [name,attr] of Object.entries(src.attributes)){
        const n=attr.itemSize, parts=[];
        groups.forEach(g=>parts.push(attr.array.slice(g.start*n,(g.start+g.count)*n)));
        const total=parts.reduce((s,a)=>s+a.length,0), arr=new attr.array.constructor(total); let off=0;
        parts.forEach(a=>{arr.set(a,off);off+=a.length;});
        geo.setAttribute(name,new THREE.BufferAttribute(arr,n));
      }
      const m=new THREE.Mesh(geo,o.material[mi]);
      m.position.copy(o.position); m.quaternion.copy(o.quaternion); m.scale.copy(o.scale);
      o.parent.add(m);
    });
    o.parent.remove(o);
  });
  // instanced meshes -> plain meshes with per-vertex colour
  const inst=[]; scene.traverse(o=>{if(o.isInstancedMesh) inst.push(o);});
  inst.forEach(im=>{
    const parts=[]; const mtx=new THREE.Matrix4(); const col=new THREE.Color();
    for(let i=0;i<im.count;i++){
      im.getMatrixAt(i,mtx);
      let g=im.geometry.index?im.geometry.toNonIndexed():im.geometry.clone();
      g.applyMatrix4(mtx);
      if(im.instanceColor) im.getColorAt(i,col); else col.setRGB(1,1,1);
      const n=g.attributes.position.count, c=new Float32Array(n*3);
      for(let k=0;k<n;k++){c[k*3]=col.r;c[k*3+1]=col.g;c[k*3+2]=col.b;}
      g.setAttribute('color',new THREE.BufferAttribute(c,3));
      for(const k of Object.keys(g.attributes)) if(!['position','normal','uv','color'].includes(k)) g.deleteAttribute(k);
      parts.push(g);
    }
    const merged=THREE.BufferGeometryUtils.mergeBufferGeometries(parts,false);
    const mm=im.material.clone(); mm.name=im.material.name; mm.vertexColors=true;
    const mesh=new THREE.Mesh(merged,mm); mesh.name=im.name;
    im.parent.add(mesh); im.parent.remove(im);
  });
  scene.background=null;
  const ex=new THREE.GLTFExporter();
  ex.parse(scene,glb=>{
    Promise.all([
      fetch('/save?name=diorama.glb',{method:'POST',body:glb}),
      fetch('/save?name=scene_info.json',{method:'POST',body:JSON.stringify(info)})
    ]).then(()=>{document.title='EXPORTED';});
  },err=>{document.title='ERROR '+err;},{binary:true,onlyVisible:true,maxTextureSize:2048});
}
fontReady.then(()=>setTimeout(exportAll,300));
})();
